name: Build APK offline-first
on:
  push:
    branches: ['felomenau-v1.3-apk']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Testar catálogo e fluxo de vendas offline
        run: |
          node felomenau-tshirts/tests/filter-search.test.js
          node felomenau-tshirts/tests/sales-order.test.js
          node felomenau-tshirts/tests/checkout.test.js
      - name: Build debug APK
        run: gradle --no-daemon -p felomenau-tshirts assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: felomenau-tshirts-apk
          path: felomenau-tshirts/app/build/outputs/apk/debug/app-debug.apk
